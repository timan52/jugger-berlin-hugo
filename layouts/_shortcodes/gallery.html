<div class="gallery">
{{ range .Site.Data.gallery }}
<a class="gallery-tile" href="{{ .src | strings.TrimPrefix "/" | relURL }}" target="_blank" rel="noopener noreferrer" aria-label="{{ .alt }} in voller Größe öffnen"><img src="{{ .src | strings.TrimPrefix "/" | relURL }}" alt="{{ .alt }}" loading="lazy"></a>
{{ end }}
</div>
