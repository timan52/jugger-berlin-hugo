<!doctype html>
<html lang="{{ .Site.Language.Lang }}">
<head>
 <meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
 <meta name="theme-color" content="#171717">
 {{ if not .Site.Params.ready }}<meta name="robots" content="noindex,nofollow">{{ end }}
 <title>{{ if .IsHome }}Jugger e.V. – Jugger in Berlin{{ else }}{{ .Title }} | Jugger e.V.{{ end }}</title>
 <meta name="description" content="{{ with .Description }}{{ . }}{{ else }}{{ .Site.Params.description }}{{ end }}">
 <link rel="canonical" href="{{ .Permalink }}">
 <meta property="og:title" content="{{ if .IsHome }}Jugger e.V. – Jugger in Berlin{{ else }}{{ .Title }} | Jugger e.V.{{ end }}"><meta property="og:type" content="website"><meta property="og:url" content="{{ .Permalink }}">
 <link rel="icon" type="image/png" href="{{ "wp-content/uploads/2018/04/cropped-favicon-32x32.png" | relURL }}">
 <link rel="stylesheet" href="{{ "css/site.css" | relURL }}">
</head>
<body class="{{ if .IsHome }}is-home{{ else }}is-inner{{ end }}">
<a class="skip" href="#inhalt">Zum Inhalt springen</a>
<header class="site-header" id="header">
 <div class="header-wrap">
  <a class="brand" href="{{ "" | relURL }}" aria-label="Jugger e.V. – Startseite"><img src="{{ "wp-content/uploads/2018/04/VereinslogoMedium.png" | relURL }}" alt="Jugger e.V." width="70" height="70"></a>
  <button class="menu-toggle" type="button" aria-label="Menü öffnen" aria-expanded="false" aria-controls="main-nav">Menü ☰</button>
  <nav class="site-nav" id="main-nav" aria-label="Hauptnavigation">{{ range .Site.Menus.main }}<a href="{{ .URL }}" {{ if $.IsMenuCurrent "main" . }}aria-current="page"{{ end }}>{{ .Name }}</a>{{ end }}</nav>
 </div>
</header>
<main id="inhalt">{{ block "main" . }}{{ end }}</main>
<footer class="site-footer"><div class="footer-wrap"><span>Jugger e.V. · Berlin</span><nav aria-label="Fußnavigation"><a href="{{ "pressemappe/" | relURL }}">Pressemappe</a><a href="{{ "impressum/" | relURL }}">Impressum</a><a href="mailto:info@jugger-berlin.de">Kontakt</a></nav></div></footer>
<script defer src="{{ "js/main.js" | relURL }}"></script>
</body></html>
